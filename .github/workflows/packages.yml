name: Packages
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing vX.Y.Z tag to publish; blank uses selected ref (branches build only)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  validate:
    name: Validate versions and select source commit
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.version.outputs.source_sha }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate package versions at the requested tag or HEAD
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: python3 scripts/validate-release.py --tag "$RELEASE_TAG"
  deb:
    name: Debian / Ubuntu (x86_64)
    needs: validate
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential git curl ca-certificates debhelper dpkg-dev fakeroot python3
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Assemble locked vendored source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/vendor-source.sh
      - name: Build and inspect package
        run: |
          mkdir -p dist/deb-build
          tar -xzf dist/p4ui-*.tar.gz -C dist/deb-build
          cd dist/deb-build/p4ui-*
          dpkg-buildpackage -d -us -uc -b
          cd ..
          dpkg-deb --info p4ui_*.deb
          dpkg -i p4ui_*.deb
          p4ui --version
          cp p4ui_*.deb "$GITHUB_WORKSPACE/dist/"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: p4ui-deb-x86_64
          path: dist/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: p4ui-source
          path: dist/p4ui-*.tar.gz
          if-no-files-found: error
  rpm:
    name: Fedora RPM (x86_64)
    needs: validate
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - name: Install build tools
        run: dnf install -y gcc git cargo rust rpm-build python3 tar gzip findutils
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - name: Assemble locked vendored source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/vendor-source.sh
      - name: Build and inspect package
        run: |
          mkdir -p dist/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp dist/p4ui-*.tar.gz dist/rpmbuild/SOURCES/
          cp packaging/rpm/p4ui.spec dist/rpmbuild/SPECS/
          rpmbuild -ba --define "_topdir $PWD/dist/rpmbuild" dist/rpmbuild/SPECS/p4ui.spec
          rpm -qip dist/rpmbuild/RPMS/*/p4ui-*.rpm
          dnf install -y dist/rpmbuild/RPMS/*/p4ui-*.rpm
          p4ui --version
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: p4ui-rpm-x86_64
          path: |
            dist/rpmbuild/RPMS/**/*.rpm
            dist/rpmbuild/SRPMS/*.rpm
          if-no-files-found: error
  arch:
    name: Arch Linux (x86_64)
    needs: validate
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git rust python
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - name: Assemble locked vendored source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/vendor-source.sh
      - name: Build and inspect package as an unprivileged user
        run: |
          python3 scripts/prepare-arch.py dist/p4ui-*.tar.gz "$RUNNER_TEMP/arch-build"
          useradd --create-home builder
          chown -R builder:builder "$RUNNER_TEMP/arch-build"
          runuser -u builder -- bash -c 'cd "$1" && makepkg --noconfirm' _ "$RUNNER_TEMP/arch-build"
          pacman -U --noconfirm "$RUNNER_TEMP"/arch-build/p4ui-*.pkg.tar.zst
          p4ui --version
          cp "$RUNNER_TEMP"/arch-build/p4ui-*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: p4ui-arch-x86_64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
  release:
    name: Publish tagged GitHub release
    needs: [validate, deb, rpm, arch]
    if: needs.validate.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.validate.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: p4ui-*
          path: release-assets
      - name: Publish packages, vendored source and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_sha }}
        run: python3 scripts/publish-release.py "$RELEASE_TAG" "$SOURCE_COMMIT" release-assets --repo "$GITHUB_REPOSITORY"
