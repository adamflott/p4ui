[package]
name = "p4ui"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-driven terminal interface for Perforce"
license = "MIT"
readme = "README.md"
repository = "https://github.com/adamflott/p4ui"
homepage = "https://github.com/adamflott/p4ui"
keywords = ["perforce", "p4", "tui", "scm"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
tempfile = "3.27"
shell-words = "1.1"
signal-hook = "0.3"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
